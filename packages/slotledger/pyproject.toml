[project]
name = "slotledger"
version = "0.1.0"
description = "Tamper-evident, append-only outcome ledger with a verifier. No Slotback imports."
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.2"]

[project.scripts]
slotledger = "slotledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slotledger"]
