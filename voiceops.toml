# Slotback on the voiceops kit: one file every command reads.
# voiceops build/push · voiceops gate · voiceops check · voiceops call/fetch
# voiceledger verify evidence/showcase-2026-10-16.zip --trusted-key KEY --rules voiceops.toml

[project]
name = "slotback"
locales = ["es", "en", "ro", "ar"]

[agent]
fragments = "agent/fragments"
profiles = "agent/profiles.json"
build_dir = "agent/build"
tools = "slotback.api.models:TOOLS"
language = "es"
# LLM pinned: the platform default drifted to a model we never chose.
llm = "claude-haiku-4-5"
temperature = 0.2
# Native Spain-Spanish voice (peninsular): the default English voice mangled Spanish on the
# first phone call. "Carolina", ElevenLabs voice library, es / peninsular.
voice_id = "UOIqAnmS11Reiei1Ytkc"
tts_model = "eleven_flash_v2_5"
tool_timeout_secs = 10
end_call_description = "End the call after log_outcome and goodbye."
# Clinical safety is Slotback's own rule on top of the kit's safety slots.
required_fragments = ["40_clinical"]

# The kit's safety slots, each reworded by Slotback's own (Spanish-first) fragment.
[agent.safety]
ai_disclosure = "10_disclosure"
upset_caller = "15_upset"
identity_before_detail = "20_identity"
third_party_voicemail = "30_privacy"
no_unbacked_promises = "50_actions"
human_on_request = "70_human_and_optout"
closing = "80_language_and_close"

[agent.directions.outbound]
first_message = "Hola, le llamo del Hospital General. Soy un asistente de inteligencia artificial y esta llamada se graba. Llamo por una cita: ¿hablo con la persona titular de la cita?"
phone_audio = true  # telephone codec in and out (no resampling on Twilio)

[agent.directions.inbound]
first_message = "Hola, Hospital General. Soy un asistente de inteligencia artificial y esta llamada se graba. ¿En qué puedo ayudarle?"
exclude_tools = ["offer_backfill", "accept_backfill", "decline_backfill"]

[push]
secret_name = "slotback_tool_secret"
state = "agent/state.json"

# Slotback's two domain checks, as generic ledger rules.
# No appointment detail on a call before that call's identity check passed.
[[ledger.rules]]
rule = "requires_before"
name = "identity_before_detail"
effect = "detail_disclosed"
precondition = "identity_verified"
scope = ["call_id", "pid"]

# Every freed slot is offered rank 1, 2, 3... in the hospital's snapshotted list order,
# leaving a rank only on a logged closing reason.
[[ledger.rules]]
rule = "follows_snapshot_order"
name = "list_order"
snapshot = "list_snapshot"
group_by = "slot_id"
subject_field = "pid"
ranked = [
  "call_attempt", "identity_verified", "identity_failed", "offer_started",
  "offer_accepted", "offer_declined", "offer_expired", "rank_skipped", "slot_filled",
]
advance_on = [
  "identity_failed", "offer_declined", "offer_expired", "rank_skipped",
  { type = "call_attempt", where = { outcome = ["no_answer", "voicemail", "busy", "wrong_number"] } },
]
claim = "offer_accepted"
fill = "slot_filled"

[evals]
scenarios = "evals.kit:SCENARIOS"
tool_runner = "evals.kit:tool_runner"
conversation = "evals.kit:conversation"
leak_vocabulary = "evals/leak_vocabulary.toml"
known_answers = "evals/known_answer"
results = "evals/results"

[deploy]
base_url = "env:SLOTBACK_API_URL"
timeout_s = 60  # the free instance sleeps; the first request wakes it

[[deploy.checks]]
check = "health"
at_least = { hospitals = 2 }

[[deploy.checks]]
check = "unsigned_refused"
tool = "get_appointment"

[[deploy.checks]]
check = "signed_roundtrip"
tool = "get_appointment"
session = { path = "/api/sessions", body = { access_code = "env:DEMO_ACCESS_CODE" } }
expect = { error = "identity_not_verified" }  # an unbound token must not get detail

[[deploy.checks]]
check = "ledger_verifies"
bundle = "evidence/showcase-2026-10-16.zip"
trusted_key = "evidence/trusted_key.txt"

[[deploy.checks]]
check = "pages"
paths = ["/", "/impact", "/console", "/roi", "/evals", "/verify", "/try"]

[[deploy.checks]]
check = "p95"
budget_ms = 300

[review]
profile = "outbound-demo"
api_url = "env:SLOTBACK_API_URL"
session = { path = "/api/sessions", body = { access_code = "env:DEMO_ACCESS_CODE", purpose = "confirm" } }
instructions = "evals.kit:call_instructions"
recordings = "recordings"
sheets = "demo/review"
disclosure_markers = ["inteligencia artificial", "ai assistant", "artificial"]
leak_context = "patient"
unbacked_promises = ["correo", "email", "sms", "mensaje de texto", "por carta"]
