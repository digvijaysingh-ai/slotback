[project]
name = "slotback"
version = "0.1.0"
description = "Outbound voice agent that confirms specialist appointments and backfills freed slots in the hospital's list order. Fictional hospital, synthetic data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pgserver>=0.1.4",
    "slotledger[pg]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "ruff>=0.7",
]

[tool.uv.sources]
slotledger = { workspace = true }

[tool.uv.workspace]
members = ["packages/slotledger"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slotback"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/slotledger/tests"]
markers = ["pg: needs a real Postgres server"]
